<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JOJO AI</title>
  <style>
    :root {
      --bg1: #fdf2e8;
      --bg2: #f7d9b4;
      --bg3: #edd5c8;
      --card: rgba(255,255,255,0.68);
      --card-strong: rgba(255,255,255,0.9);
      --text: #221b1a;
      --muted: #6f625e;
      --accent: #ef7a4a;
      --accent-deep: #d45d2d;
      --line: rgba(112, 88, 76, 0.14);
      --bubble-user: #f4b38a;
      --bubble-ai: #fff8f4;
      --shadow: 0 30px 70px rgba(93, 53, 30, 0.18);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: Inter, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
      color: var(--text);
    }

    body {
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(25px);
      opacity: 0.35;
      pointer-events: none;
    }

    body::before {
      width: 420px;
      height: 420px;
      top: -80px;
      left: -70px;
      background: rgba(255, 193, 137, 0.55);
    }

    body::after {
      width: 500px;
      height: 500px;
      right: -110px;
      bottom: -120px;
      background: rgba(231, 149, 98, 0.42);
    }

    .hero {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 24px;
    }

    .brand {
      text-align: center;
      padding: 22px 26px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 22px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
      box-shadow: 0 16px 32px rgba(121, 87, 58, 0.08);
    }

    .brand-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      margin: 0 auto 12px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ffdbb7, #f59d6f 45%, #e86d4a);
      color: #fff;
      font-size: 28px;
      box-shadow: 0 18px 30px rgba(232, 109, 74, 0.3);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.3rem);
      letter-spacing: -0.06em;
      font-weight: 800;
    }

    .brand p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.96rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .chat-toggle {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 74px;
      height: 74px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: #fff;
      font-size: 2rem;
      box-shadow: 0 20px 35px rgba(210, 95, 51, 0.38);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .chat-toggle:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 25px 40px rgba(210, 95, 51, 0.46);
    }

    .chat-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 30;
      display: flex;
      flex-direction: column;
      width: min(90vw, 430px);
      height: min(82vh, 700px);
      transform: translate(-50%, -50%) scale(0.96);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 26px;
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    .chat-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.22);
      border-radius: 26px 26px 0 0;
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }

    .chat-title-badge {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f8d2b1, #ee8e5f);
      color: white;
      font-size: 0.9rem;
    }

    .close-btn {
      border: none;
      background: rgba(0,0,0,0.03);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 10px;
      font-size: 1.3rem;
      cursor: pointer;
    }

    .chat-body {
      flex: 1;
      padding: 18px 16px 12px;
      overflow-y: auto;
      background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.04));
    }

    .msg {
      display: flex;
      margin-bottom: 12px;
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 0.94rem;
      box-shadow: 0 10px 18px rgba(94, 62, 45, 0.05);
    }

    .msg.ai {
      margin-right: auto;
      background: var(--bubble-ai);
      border-top-left-radius: 8px;
      color: var(--text);
    }

    .msg.user {
      margin-left: auto;
      background: linear-gradient(135deg, #f6c79d, #f2a66f);
      border-top-right-radius: 8px;
      color: #2c1d17;
    }

    .chat-form {
      display: flex;
      gap: 10px;
      padding: 14px 14px 16px;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.15);
      border-radius: 0 0 26px 26px;
    }

    .chat-input {
      flex: 1;
      min-height: 48px;
      max-height: 120px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.75);
      color: var(--text);
      resize: none;
      outline: none;
      font: inherit;
    }

    .chat-input:focus {
      border-color: rgba(218, 120, 75, 0.65);
      box-shadow: 0 0 0 3px rgba(239, 122, 74, 0.12);
    }

    .send-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 48px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-deep));
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
      box-shadow: 0 12px 22px rgba(214, 106, 57, 0.25);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    @media (max-width: 520px) {
      .chat-panel {
        width: min(92vw, 390px);
        height: min(80vh, 620px);
      }

      .chat-toggle {
        width: 64px;
        height: 64px;
        right: 18px;
        bottom: 18px;
      }

      .brand {
        padding: 18px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <h1>JOJO AI</h1>
      <p>smart ideas. better flow.</p>
    </div>
  </div>

  <button class="chat-toggle" id="chatToggle" aria-label="Open chat">✦</button>

  <aside class="chat-panel" id="chatPanel" aria-label="JOJO AI chat panel">
    <div class="chat-header">
      <div class="chat-title">
        <span class="chat-title-badge">J</span>
        JOJO AI
      </div>
      <button class="close-btn" id="closeChat" aria-label="Close chat">×</button>
    </div>

    <div class="chat-body">
      <div class="msg ai">Hello! I’m JOJO AI. Tell me what you want help with.</div>
      <div class="msg user">I want a clean, simple, modern chat flow.</div>
    </div>

    <form class="chat-form" id="chatForm">
      <textarea class="chat-input" id="chatInput" rows="1" placeholder="Type your message..."></textarea>
      <button class="send-btn" id="sendBtn" type="submit" aria-label="Send message">➤</button>
    </form>
  </aside>

  <script>
    const chatToggle = document.getElementById('chatToggle');
    const chatPanel = document.getElementById('chatPanel');
    const closeChat = document.getElementById('closeChat');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function openChat() {
      chatPanel.classList.add('open');
      setTimeout(() => chatInput.focus(), 120);
    }

    function closeChatPanel() {
      chatPanel.classList.remove('open');
    }

    chatToggle.addEventListener('click', openChat);
    closeChat.addEventListener('click', closeChatPanel);

    chatInput.addEventListener('input', () => {
      sendBtn.disabled = !chatInput.value.trim();
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const value = chatInput.value.trim();
      if (!value) return;

      const body = document.querySelector('.chat-body');
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = value;
      body.appendChild(userMsg);

      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      aiMsg.textContent = 'That sounds good. I’m ready to help — connect me to your AI backend and I’ll respond here.';
      body.appendChild(aiMsg);

      body.scrollTop = body.scrollHeight;
      chatInput.value = '';
      sendBtn.disabled = true;
    });

    sendBtn.disabled = true;
  </script>
</body>
</html>
